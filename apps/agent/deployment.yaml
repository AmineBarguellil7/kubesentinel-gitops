apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: kubesentinel
  labels:
    app: agent
spec:
  # One replica: the Slack thread mapping is kept in memory.
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      serviceAccountName: agent
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: kubesentinel-agent:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # GROQ_API_KEY, SLACK_BOT_TOKEN, SLACK_APP_TOKEN, SLACK_CHANNEL_ID. Created by
          # `make agent-secrets`, never committed.
          envFrom:
            - secretRef:
                name: kubesentinel-agent
          env:
            # llama-3.3-70b-versatile (the code's default) is not available to this Groq account
            # (404 model_not_found). gpt-oss-120b supports the tool calling used for the
            # structured diagnosis.
            - name: GROQ_MODEL
              value: openai/gpt-oss-120b
            - name: PROMETHEUS_URL
              value: http://monitoring-kube-prometheus-prometheus.monitoring:9090
            - name: TARGET_NAMESPACE
              value: demo
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
