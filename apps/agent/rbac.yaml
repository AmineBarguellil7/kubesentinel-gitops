# Read-only access to the demo namespace, nothing else: no Secrets, ConfigMaps or write verbs,
# and no ClusterRole. The agent cannot read anything outside "demo".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesentinel-agent-read
  namespace: demo
  labels:
    app: agent
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesentinel-agent-read
  namespace: demo
  labels:
    app: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubesentinel-agent-read
subjects:
  - kind: ServiceAccount
    name: agent
    namespace: kubesentinel
