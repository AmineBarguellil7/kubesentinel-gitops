# Grafana Alloy as a DaemonSet: each pod tails the container log files of its own node
# (/var/log/pods) and pushes them to Loki.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.16.0
    helm:
      releaseName: alloy
      valuesObject:
        controller:
          type: daemonset
          # Also run on the control-plane node so its pods' logs are shipped too.
          tolerations:
            - operator: Exists
              effect: NoSchedule
        alloy:
          enableReporting: false
          mounts:
            varlog: true
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          configMap:
            content: |
              // Pods scheduled on this node only (HOSTNAME is set to the node name by the chart).
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("HOSTNAME")
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                // app = the "app" label, else app.kubernetes.io/name, else the container name.
                rule {
                  source_labels = [
                    "__meta_kubernetes_pod_label_app",
                    "__meta_kubernetes_pod_label_app_kubernetes_io_name",
                    "__meta_kubernetes_pod_container_name",
                  ]
                  separator     = ";"
                  regex         = "^;*([^;]+)(;.*)?$"
                  target_label  = "app"
                  replacement   = "$1"
                }
                // Log files of the container on the node: /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }

              local.file_match "pods" {
                path_targets = discovery.relabel.pods.output
              }

              loki.source.file "pods" {
                targets    = local.file_match.pods.targets
                forward_to = [loki.process.pods.receiver]
              }

              // Strip the CRI prefix (timestamp, stream, flags) containerd writes on each line.
              loki.process "pods" {
                stage.cri {}
                forward_to = [loki.write.loki.receiver]
              }

              loki.write "loki" {
                endpoint {
                  url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
                }
              }
        configReloader:
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 50m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
