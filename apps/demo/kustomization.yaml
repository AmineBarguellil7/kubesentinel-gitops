apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  - namespace.yaml
  - redis.yaml
  - payments.yaml
  - orders.yaml
  - api.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

# Grafana's dashboard sidecar loads every ConfigMap labelled grafana_dashboard=1.
configMapGenerator:
  - name: grafana-dashboard-demo-shop
    files:
      - dashboards/demo-shop.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
